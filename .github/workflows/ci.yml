name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  experiment-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependências experimentais
        run: make setup PYTHON=python

      - name: Validar configurações e imports
        run: make validate PYTHON=python

      - name: Compilar módulos
        run: make compile PYTHON=python

      - name: Executar suíte
        run: make test PYTHON=python

      - name: Executar smoke B0-B5
        run: make smoke PYTHON=python
